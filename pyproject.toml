[project]
name = "vae-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Caleb Bartholomew", email = "caleb.bartholomew@schoolai.com" },
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "lightning>=2.5.0.post0",
    "numpy<2.2.1",
    "orjson>=3.10.13",
    "scikit-learn>=1.6.0",
    "tensorboard>=2.18.0",
    "tensorflow>=2.18.0",
    "torch>=2.5.1",
    "torchinfo>=1.8.0",
    "torchvision>=0.20.1",
]

[project.scripts]
vae-demo = "vae_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
